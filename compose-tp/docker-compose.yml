version: '3.8'

services:

  # Service 1 : application web
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./site:/usr/share/nginx/html
    depends_on:
      - db

  # Service 2 : base de données
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: monapp
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret123
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Service 3 : cache Redis
  cache:
    image: redis:alpine
    ports:
      - "6379:6379"

# Volume persistant (≈ Blob Storage)
volumes:
  pgdata:
